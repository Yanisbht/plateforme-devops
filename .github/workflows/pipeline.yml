name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Set lower case repository name
        id: repo
        run: echo "repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo_lc }}/api:${{ steps.vars.outputs.sha_short }}

      - name: Update Dev Kustomization image tag
        run: |
          cd deploy/overlays/dev
          kustomize edit set image api=ghcr.io/${{ steps.repo.outputs.repo_lc }}/api:${{ steps.vars.outputs.sha_short }}

      - name: Commit and push changes
        run: |
          git config --global user.name "pipeline-ci"
          git config --global user.email "pipeline-ci@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "chore(ci): update dev image tag to ${{ steps.vars.outputs.sha_short }}" || exit 0
          git push
